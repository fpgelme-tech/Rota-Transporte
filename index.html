<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rota Fiorino</title>
<meta name="description" content="Roteirizador de entregas com paradas numeradas, financeiro diário e planejador de 3 saídas — Shopee, Mercado Livre, 99 e Lalamove.">
<meta name="theme-color" content="#0E6B3C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rota Fiorino">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js" defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F1F3F5; --surface:#FFFFFF; --surface2:#E8EBEE; --ink:#151A20; --ink2:#4B5563; --ink3:#7B8794; --line:#D5DAE0;
  --accent:#0E6B3C; --accent-ink:#FFFFFF; --accent-soft:#DCEFE3;
  --tag:#FFC933; --tag-ink:#1A1400;
  --ok:#2C8C57; --ok-soft:#DDF2E5; --bad:#C0392B; --bad-soft:#F8DEDB; --warn:#B7791F; --warn-soft:#FBEFD3; --info:#2B5FA8; --info-soft:#DDE7F6;
  --shadow:0 1px 2px rgba(20,26,32,.08),0 4px 12px rgba(20,26,32,.06);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181C; --surface:#1E2227; --surface2:#272C33; --ink:#EEF1F4; --ink2:#B4BCC6; --ink3:#7F8894; --line:#343A43;
    --accent:#3FA46E; --accent-ink:#0B1A11; --accent-soft:#1C3527;
    --tag:#FFC933; --tag-ink:#1A1400;
    --ok:#4CB877; --ok-soft:#1B3526; --bad:#E2685B; --bad-soft:#40201C; --warn:#E0A33A; --warn-soft:#3A2E14; --info:#6E9BE0; --info-soft:#1E2C44;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15181C; --surface:#1E2227; --surface2:#272C33; --ink:#EEF1F4; --ink2:#B4BCC6; --ink3:#7F8894; --line:#343A43;
  --accent:#3FA46E; --accent-ink:#0B1A11; --accent-soft:#1C3527;
  --tag:#FFC933; --tag-ink:#1A1400;
  --ok:#4CB877; --ok-soft:#1B3526; --bad:#E2685B; --bad-soft:#40201C; --warn:#E0A33A; --warn-soft:#3A2E14; --info:#6E9BE0; --info-soft:#1E2C44;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,.num,.tag,.big{font-family:"Barlow Semi Condensed","Arial Narrow","Barlow",sans-serif}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
a{color:var(--info)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 84px;min-height:100vh}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand .plate{background:var(--accent);color:var(--accent-ink);font-family:"Barlow Semi Condensed",sans-serif;font-weight:800;font-size:18px;letter-spacing:.04em;padding:4px 10px;border-radius:6px;text-transform:uppercase}
.brand small{display:block;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.sync{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.sync.on i{background:var(--ok)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;width:100%;max-width:760px}
nav.tabs button{flex:1;background:none;border:0;padding:10px 4px 9px;font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);border-top:3px solid transparent;margin-top:-1px}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
nav.tabs button svg{display:block;margin:0 auto 3px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding-block:16px}
section.view[hidden]{display:none}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1 1 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.flat{box-shadow:none}
.muted{color:var(--ink3)}
.small{font-size:13px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;min-height:42px;font-family:"Barlow Semi Condensed",sans-serif;font-size:16px;letter-spacing:.02em}
a.btn{text-decoration:none;color:inherit}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 10px;font-size:14px}
.btn.block{width:100%}
.btn.tall{min-height:56px;font-size:19px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:600}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px;width:100%}
.field textarea{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid.tight{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.tag{display:inline-flex;align-items:center;justify-content:center;background:var(--tag);color:var(--tag-ink);font-weight:800;font-size:22px;min-width:46px;height:46px;padding:0 8px;border-radius:6px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12);font-variant-numeric:tabular-nums;flex:none}
.tag.sm{font-size:15px;min-width:32px;height:32px}
.tag.done{background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.tag.fail{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.tag.none{background:var(--surface2);color:var(--ink3);box-shadow:inset 0 0 0 2px var(--line)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.stop{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.stop:last-child{border-bottom:0}
.stop .addr{font-weight:600;font-size:16px;line-height:1.25}
.stop .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.stop .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.stop.cur{background:var(--accent-soft);margin:0 -14px;padding:12px 14px;border-radius:8px;border-bottom:0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:600}
.stat .v{font-family:"Barlow Semi Condensed",sans-serif;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
.stat .v.pos{color:var(--ok)}.stat .v.neg{color:var(--bad)}
.stat .s{font-size:12px;color:var(--ink3)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto}
.route-item{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.route-item:hover{border-color:var(--accent)}
.route-item .n{font-family:"Barlow Semi Condensed",sans-serif;font-size:17px;font-weight:700}
.saida-badge{font-family:"Barlow Semi Condensed",sans-serif;font-weight:800;font-size:13px;letter-spacing:.06em;background:var(--surface2);color:var(--ink2);padding:3px 8px;border-radius:5px;text-transform:uppercase}
.progress{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;display:flex}
.progress b{display:block;height:100%}
.progress .d{background:var(--ok)}.progress .f{background:var(--bad)}
.map{width:100%;aspect-ratio:4/3;max-width:100%;background:var(--surface2);border-radius:8px;display:block}
.map text{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700}
.notice{padding:10px 12px;border-radius:8px;font-size:14px;border:1px solid var(--line);background:var(--surface2)}
.notice.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.notice.bad{background:var(--bad-soft);border-color:var(--bad)}
.notice.ok{background:var(--ok-soft);border-color:var(--ok)}
.notice.info{background:var(--info-soft);border-color:var(--info)}
.lmap{width:100%;aspect-ratio:1/1;max-width:100%;border-radius:8px;overflow:hidden;background:var(--surface2);z-index:0}
.lmap .stopmk{background:var(--tag);color:var(--tag-ink);font-family:"Barlow Semi Condensed",sans-serif;font-weight:800;font-size:12px;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.lmap .stopmk.done{background:var(--ok);color:#fff}.lmap .stopmk.fail{background:var(--bad);color:#fff}.lmap .stopmk.cur{width:34px;height:34px;font-size:16px;border-color:var(--ink);box-shadow:0 0 0 4px rgba(255,201,51,.4)}
.lmap .hubmk{background:var(--accent);color:#fff;font-family:"Barlow Semi Condensed",sans-serif;font-weight:800;font-size:10px;border-radius:4px;padding:3px 5px;border:2px solid #fff;white-space:nowrap}
.lmap .memk{width:18px;height:18px;border-radius:50%;background:#2B5FA8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(43,95,168,.25)}
.leaflet-popup-content{font-family:"Barlow",sans-serif;font-size:14px;margin:10px 12px}.leaflet-popup-content .btn{margin-top:6px}
.mapbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}.sheet .btn{justify-content:flex-start;gap:12px;padding-left:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;box-shadow:var(--shadow);max-width:90vw}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--ink3)}.kv dd{margin:0;font-weight:600}
.zone{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.zone div{background:var(--surface2);border:1px dashed var(--line);border-radius:6px;padding:8px;font-size:13px;min-height:54px}
.zone div b{display:block;font-family:"Barlow Semi Condensed",sans-serif;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3)}
.zone .door{grid-column:1/-1;text-align:center;background:transparent;border:0;min-height:0;padding:2px;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.timeline{width:100%;max-width:100%;display:block}
.timeline text{font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:11px;fill:var(--ink2)}
.guide p{max-width:68ch}
.guide h3{margin-top:18px}
.guide ul{padding-left:18px;max-width:68ch}
.guide li{margin:4px 0}
details summary{cursor:pointer;font-weight:600}
.hidden{display:none!important}
.exemplo{border-left:4px solid var(--warn)}
@media (prefers-reduced-motion:no-preference){.route-item,.btn{transition:border-color .15s,background .15s}}
@media (max-width:420px){.tag{font-size:19px;min-width:40px;height:40px}.stat .v{font-size:24px}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><span class="plate">Rota Fiorino</span><div><strong>Entregas · São Paulo</strong><small>Shopee · Mercado Livre · 99 · Lalamove</small></div></div>
    <div class="sync" id="sync"><i></i><span>local</span></div>
  </header>
  <main>
    <section class="view" id="v-rotas"></section>
    <section class="view" id="v-fin" hidden></section>
    <section class="view" id="v-saidas" hidden></section>
    <section class="view" id="v-guia" hidden></section>
  </main>
</div>
<nav class="tabs" aria-label="Seções"><div class="in">
  <button id="tab-rotas" role="tab" aria-selected="true" data-tab="rotas"><svg viewBox="0 0 24 24"><path d="M4 19l4-14 4 9 4-6 4 11"/><circle cx="4" cy="19" r="1.5"/><circle cx="20" cy="19" r="1.5"/></svg>Rotas</button>
  <button id="tab-fin" role="tab" aria-selected="false" data-tab="fin"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Financeiro</button>
  <button id="tab-saidas" role="tab" aria-selected="false" data-tab="saidas"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Saídas</button>
  <button id="tab-guia" role="tab" aria-selected="false" data-tab="guia"><svg viewBox="0 0 24 24"><path d="M4 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H4zM20 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>Guia</button>
</div></nav>

<script>
/* ============ estado ============ */
const PLATFORMS = {shopee:'Shopee (SPX)', ml:'Mercado Livre', n99:'99Entrega', lala:'Lalamove', outro:'Outro'};
const ZONES = ['Porta · esq.','Porta · dir.','Meio · esq.','Meio · dir.','Fundo · esq.','Fundo · dir.'];
const FAIL_REASONS = ['Ausente','Endereço não encontrado','Recusado','Sem acesso (portaria/condomínio)','Fora do horário','Pacote avariado','Outro'];
const DEF_SETTINGS = {
  idFormat:'legacy', googleKey:'', minStop:1, avgSpeed:22, detour:1.35, hubAddr:'', navApp:'ask',
  fuel:'etanol', priceEtanol:3.75, priceGasolina:6.31, kmlEtanol:7.0, kmlGasolina:10.0, maintKm:0.20,
  ipvaAno:2435, seguroAno:4000, dasMes:76, deprecAno:4140, outrosFixosMes:0, diasMes:24,
};
let S = {settings:{...DEF_SETTINGS}, routes:{}, days:{}};
let db=null, sample=true, downloads=true, sampleImg=true, deferredInstall=null;
let ui = {tab:'rotas', routeId:null, sub:'list', finMonth:null, finEdit:null, busy:''};
const uid = ()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const todayISO = ()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const BRL = n=>(n<0?'-':'')+'R$ '+Math.abs(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const N1 = n=>(n||0).toLocaleString('pt-BR',{maximumFractionDigits:1});
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm = m=>{m=Math.round(m);const h=Math.floor(m/60)%24;return String(h).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const toMin = t=>{const [h,m]=(t||'0:0').split(':').map(Number);return h*60+(m||0)};
const dateBR = iso=>{if(!iso)return '';const [y,m,d]=iso.split('-');return d+'/'+m+'/'+y};
let toastT; function toast(msg){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}

/* ============ persistência ============ */
const LS='rotaFiorino.v1';
function lsLoad(){try{const j=localStorage.getItem(LS);if(j){const o=JSON.parse(j);S={settings:{...DEF_SETTINGS,...(o.settings||{})},routes:o.routes||{},days:o.days||{}}}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
async function persistRoute(id){lsSave()}
async function persistDay(date){lsSave()}
async function persistSettings(){lsSave()}
function setSync(txt,on){const el=document.getElementById('sync');el.querySelector('span').textContent=txt;el.classList.toggle('on',!!on)}
function backupExport(){const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});dl(blob,'rota-fiorino-backup-'+todayISO()+'.json')}
function backupImport(file){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||!o.routes||!o.days)throw 0;S={settings:{...DEF_SETTINGS,...(o.settings||{})},routes:o.routes,days:o.days};lsSave();ui.routeId=null;render();toast('Backup restaurado')}catch(e){toast('Arquivo de backup inválido')}};fr.readAsText(file)}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}

/* ============ exemplos ============ */
function seedExamples(){
  const rid='ex-'+todayISO();
  const stops=[
    ['Rua Barão do Triunfo, 88 – Brooklin',-23.6175,-46.6893,2],['Av. Santo Amaro, 4500 – Brooklin',-23.6154,-46.6817,1],
    ['Rua Alvorada, 1200 – Vila Olímpia',-23.5941,-46.6802,1],['Rua Funchal, 200 – Vila Olímpia',-23.5945,-46.6890,3],
    ['Rua Guararapes, 700 – Brooklin',-23.6114,-46.6960,1],['Av. Vereador José Diniz, 3300 – Campo Belo',-23.6236,-46.6738,2],
    ['Rua Pascal, 500 – Campo Belo',-23.6198,-46.6690,1],['Rua Gabriele D\'Annunzio, 900 – Campo Belo',-23.6153,-46.6642,1],
    ['Av. Ibirapuera, 2900 – Moema',-23.6068,-46.6634,2],['Rua Tuim, 300 – Moema',-23.6000,-46.6698,1],
    ['Rua Bela Cintra, 1500 – Consolação',-23.5589,-46.6633,1],['Rua Augusta, 2000 – Jardins',-23.5610,-46.6600,1],
  ];
  S.routes[rid]={id:rid,name:'Exemplo — Shopee Jurubatuba',date:todayISO(),saida:1,platform:'shopee',exemplo:true,status:'planning',
    start:{addr:'Hub Shopee Jurubatuba – Av. das Nações Unidas, 22000',lat:-23.6462,lng:-46.7159},roundtrip:true,idFormat:'legacy',
    stops:stops.map((s,i)=>({id:uid(),addr:s[0],lat:s[1],lng:s[2],pkgs:s[3],order:'auto',type:'delivery',status:'pending',notes:i===3?'Portaria: deixar com o zelador':'',pos:null}))};
  const days=[[-2,[{platform:'shopee',saida:1,pkgs:48,stops:31,receita:210,km:62,horas:6.5,comb:0,estac:7,alim:18,outros:0}]],

function optimizeRoute(r){

function assignIds(r){if(r.status==='active'){let mx=0;r.stops.forEach(s=>{const n=parseInt(String(s.sid||'').replace(/\D/g,''))||0;if(n>mx)mx=n});r.stops.forEach(s=>{if(!s.sid){mx++;s.sid=r.idFormat==='modern'?('A'+mx):String(mx)}});return}r.stops.forEach((s,i)=>{s.sid=r.idFormat==='modern'?('A'+(i+1)):String(i+1)})}

async function readLabels(r,files){

      found.forEach(o=>{r.stops.push({id:uid(),addr:o.addr,cep:o.cep,lat:null,lng:null,pkgs:1,order:'auto',type:'delivery',status:'pending',notes:'lida por OCR — confira',pos:null});total++})}

  }catch(e){console.warn(e);toast('Falha ao ler a foto: '+(e.message||e))}
  ui.busy='';lsSave();render();if(total)autoGeo(r);

/* ============ Google Maps: trânsito ao vivo e otimização por trânsito ============ */
let gmState='none'; // none | loading | ready | error
function gmKey(){return (S.settings.googleKey||'').trim()}
function loadGoogleMaps(){
  if(!gmKey()||gmState!=='none')return;gmState='loading';
  window.__gmReady=()=>{gmState='ready';render()};
  const sc=document.createElement('script');sc.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(gmKey())+'&v=weekly&loading=async&language=pt-BR&region=BR&callback=__gmReady';

  window.gm_authFailure=()=>{gmState='error';toast('Chave do Google Maps recusada — confira as restrições da chave');render()};
  document.head.appendChild(sc);
}
function decodePolyline(str){let i=0,lat=0,lng=0,out=[];while(i<str.length){let b,sh=0,r=0;do{b=str.charCodeAt(i++)-63;r|=(b&0x1f)<<sh;sh+=5}while(b>=0x20);lat+=(r&1)?~(r>>1):(r>>1);sh=0;r=0;do{b=str.charCodeAt(i++)-63;r|=(b&0x1f)<<sh;sh+=5}while(b>=0x20);lng+=(r&1)?~(r>>1):(r>>1);out.push({lat:lat/1e5,lng:lng/1e5})}return out}
function wp(s){return s.lat!=null?{location:{latLng:{latitude:s.lat,longitude:s.lng}}}:{address:s.addr+(/são paulo|sp\b/i.test(s.addr)?'':', São Paulo, SP')}}

function etaList(r){ // ETA acumulada por parada a partir de agora, se houver dados de trânsito

}

function renderChart(){
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().slice(0,10))}
  const data=days.map(dt=>{const o=sumPeriod([dt]);return {dt,rec:o.rec,cost:o.varc+o.fix,has:o.days>0}});
  if(!data.some(d=>d.has))return '';
  const W=560,H=190,PL=44,PB=28,PT=14;const max=Math.max(100,...data.map(d=>Math.max(d.rec,d.cost)));const step=max>800?400:max>400?200:100;const top=Math.ceil(max/step)*step;
  const bw=(W-PL-8)/14;const y=v=>PT+(H-PT-PB)*(1-v/top);
  let g='';for(let t=0;t<=top;t+=step)g+=`<line x1="${PL}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${PL-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`;
  const bars=data.map((d,i)=>{const x=PL+i*bw;return `<rect x="${x+3}" y="${y(d.rec)}" width="${bw/2-4}" height="${y(0)-y(d.rec)}" fill="var(--accent)" rx="2"/><rect x="${x+bw/2}" y="${y(d.cost)}" width="${bw/2-4}" height="${y(0)-y(d.cost)}" fill="var(--bad)" opacity=".75" rx="2"/><text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${d.dt.slice(8)}/${d.dt.slice(5,7)}</text>`}).join('');
  return `<div class="card"><div class="row between"><h3>Últimos 14 dias</h3><span class="small"><span class="chip accent">receita</span> <span class="chip bad">custo total</span></span></div><svg class="timeline" viewBox="0 0 ${W} ${H}" role="img" aria-label="Receita e custo por dia">${g}${bars}</svg></div>`;
}

const PRESETS={
  shopee_manha:{label:'Shopee standard · manhã',platform:'shopee',chegada:'05:30',espera:90,paradas:35,km:45,receita:220,devolve:true},
  ml_manha:{label:'ML turno manhã (7–12h)',platform:'ml',chegada:'07:00',espera:40,paradas:40,km:40,receita:200,devolve:true},
  ml_tarde:{label:'ML turno tarde (12–18h)',platform:'ml',chegada:'12:30',espera:40,paradas:35,km:38,receita:180,devolve:true},
  shopee_rapida:{label:'Shopee Entrega Rápida · tarde',platform:'shopee',chegada:'14:00',espera:45,paradas:25,km:35,receita:150,devolve:true},
  ml_noite:{label:'ML turno noite (18–23h)',platform:'ml',chegada:'18:00',espera:30,paradas:25,km:30,receita:160,devolve:true},
  frete:{label:'Fretes 99 / Lalamove',platform:'lala',chegada:'18:30',espera:15,paradas:3,km:30,receita:110,devolve:false},
  nenhuma:{label:'— sem saída —',platform:'',chegada:'',espera:0,paradas:0,km:0,receita:0,devolve:false},
};
const DEADLINES={shopee:22*60,ml:22*60,lala:24*60,n99:24*60,outro:24*60};
function defaultPlan(){return {saidas:[{preset:'shopee_manha',...PRESETS.shopee_manha},{preset:'ml_tarde',...PRESETS.ml_tarde},{preset:'ml_noite',...PRESETS.ml_noite}],kmHub:12,minStop:S.settings.minStop,vel:S.settings.avgSpeed}}
function simulate(plan){
  let t=0;const out=[];const st=S.settings;
  plan.saidas.forEach((s,i)=>{if(!s.platform){out.push(null);return}
    const cheg=Math.max(toMin(s.chegada),t);const sai=cheg+s.espera;const dur=s.km/plan.vel*60+s.paradas*plan.minStop;const fim=sai+dur;const volta=s.devolve?fim+(plan.kmHub/plan.vel*60):fim;
    const kmTot=s.km+plan.kmHub*(s.devolve?2:1);const custo=kmTot*varCostKm();
    const warns=[];if(cheg>toMin(s.chegada)+1)warns.push('Começa às '+hm(cheg)+', depois do planejado ('+s.chegada+'): a saída anterior termina tarde.');
    if(fim>DEADLINES[s.platform])warns.push('Termina às '+hm(fim)+' — passa do limite de devolução (~22h).');
    if(s.platform==='ml'&&s.preset==='ml_manha'&&fim>12*60)warns.push('Estoura o turno da manhã (7–12h).');
    if(s.platform==='ml'&&s.preset==='ml_tarde'&&fim>18*60)warns.push('Estoura o turno da tarde (12–18h).');
    out.push({cheg,sai,fim,volta,dur,kmTot,custo,liq:s.receita-custo,warns});t=volta+10});
  return out;
}

function renderTimeline(plan,sim){
  const W=600,H=110,PL=8,PR=8,T0=4*60,T1=24*60;const x=m=>PL+(W-PL-PR)*(Math.min(Math.max(m,T0),T1)-T0)/(T1-T0);

  const cols=['var(--accent)','var(--info)','var(--warn)'];
  const bars=sim.map((r,i)=>{if(!r)return '';const y=22+i*24;return `<rect x="${x(r.cheg)}" y="${y}" width="${Math.max(2,x(r.sai)-x(r.cheg))}" height="16" fill="var(--surface2)" stroke="${cols[i]}" rx="3"/><rect x="${x(r.sai)}" y="${y}" width="${Math.max(2,x(r.fim)-x(r.sai))}" height="16" fill="${cols[i]}" rx="3"/>${r.volta>r.fim?`<rect x="${x(r.fim)}" y="${y+4}" width="${Math.max(2,x(r.volta)-x(r.fim))}" height="8" fill="${cols[i]}" opacity=".45" rx="2"/>`:''}<text x="${x(r.cheg)+4}" y="${y+12}" fill="#fff" style="font-size:10px">${i+1}ª ${hm(r.sai)}–${hm(r.fim)}</text>`}).join('');
  return `<div class="card"><svg class="timeline" viewBox="0 0 ${W} ${H}" role="img" aria-label="Linha do tempo das saídas">${g}${bars}</svg><div class="small muted">cinza = espera no hub · cheio = entregando · claro = volta ao hub</div></div>`;
}

        <tr><td><b>Lalamove</b></td><td>Fretes imediatos/agendados, categoria Utilitário; comissão aparece só depois de aceitar</td><td>Cliente paga base R$ 27 + R$ 2,70/km (2–15 km), R$ 1,50 (15–25), R$ 1,00 (25+)</td><td>Até domingo 23h59 → repasse quarta</td></tr>
      </tbody></table></div>
      <p class="small muted">Requisitos comuns: MEI com CNAE 4930-2/01, 4930-2/02, 5320-2/01, 5320-2/02 ou 5229-0/99 (Shopee e ML); CNH com EAR; Fiorino aceita nas quatro; colete refletivo (Shopee: bota com CA também).</p>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Fiorino — custo de referência</h3>
      <p>Etanol R$ 3,75 e gasolina R$ 6,31 na capital (ANP, início de set/2026): com paridade de 59%, <b>etanol compensa</b>. Carregada na cidade: 1.3 Firefly ~10 km/L gasolina / ~7 etanol; 1.4 Fire ~9 / ~6,2. Manutenção + pneus ~R$ 0,20/km. Fixos (IPVA 4% + seguro + DAS + depreciação) ≈ R$ 60–65 por dia trabalhado. <b>Total ≈ R$ 1,20–1,45/km</b>. Capacidade: 3,35 m³ / 650 kg → 150–250 pacotes.</p>
      <p>Uma rota de R$ 180 com 90 km no total deixa ~R$ 50; uma de R$ 300 com os mesmos km deixa ~R$ 170. O que muda o resultado é o <b>valor da rota</b> e o <b>número de saídas</b>, não economizar combustível.</p>
    </div>
    <div class="card">
      <h3 style="margin-top:0">O que o Spoke (ex-Circuit) faz e o que esta página replica</h3>
      <div class="tablewrap"><table><thead><tr><th>Função do Spoke</th><th>Aqui</th></tr></thead><tbody>
        <tr><td>Adicionar paradas: digitar, colar, planilha CSV/XLSX, foto/scan de etiqueta ou manifesto, voz</td><td>Colar lista, planilha CSV/XLSX, foto das etiquetas (OCR no aparelho). Sem voz.</td></tr>
        <tr><td>Ordem First / Auto / Last, pacotes por parada, notas, tipo</td><td>Sim (Primeira / Auto / Última, pacotes, nota)</td></tr>
        <tr><td>Otimizar com trânsito, janelas, pausas, lado da rua</td><td>Com chave Google: Routes API com trânsito ao vivo (ordem, km e tempo reais). Sem chave: distância (vizinho mais próximo + 2-opt). Sem janelas ou pausas.</td></tr>
        <tr><td>Stop ID fixo (1,2,3… ou A1,A2…), atribuído após otimizar</td><td>Sim, mesmos dois formatos</td></tr>
        <tr><td>Package Finder / Load vehicle (posição no carro)</td><td>Zonas do baú em blocos de 10 (LIFO) + busca por nº</td></tr>
        <tr><td>Navegar (Google Maps / Waze / interna), próxima parada automática</td><td>Botão Navegar pergunta Google Maps ou Waze (ou lembra sua escolha)</td></tr>
        <tr><td>Entregue / Falhou, Make next, reotimizar em rota</td><td>Entregue / Falhou com motivo, Tornar próxima, reabrir</td></tr>
        <tr><td>Comprovante: nota + foto</td><td>Nome de quem recebeu + horário (sem foto — a prova válida é a do app oficial)</td></tr>
        <tr><td>Histórico e estatísticas</td><td>Histórico de rotas + lançamento financeiro automático ao finalizar</td></tr>
        <tr><td>Mapa com trânsito</td><td>Com sua chave do Google Maps: mapa com trânsito ao vivo, otimização da ordem pela Routes API considerando o trânsito e ETA por parada. Sem chave: mapa OpenStreetMap com zoom, números das paradas, linha da rota e sua posição por GPS (sem camada de trânsito).</td></tr>
      </tbody></table></div>
      <p class="small muted">Spoke: grátis até 10 paradas por rota; Lite R$ 24,90/mês; Standard R$ 49,90/mês ou R$ 299,90/ano. Para rotas de 60+ paradas com trânsito real, o Spoke pago ou o DF Rotas (importa a planilha SPX e lê o QR) continuam valendo — esta página organiza, numera, controla e faz a conta.</p>
    </div>
    <div class="card">
      <h3 style="margin-top:0">3 saídas por dia — o padrão que fecha</h3>
      <ul>
        <li><b>1ª (madrugada/manhã)</b>: Shopee standard (hub 4h–7h) ou ML manhã 7–12h. Escolha região preferida no dia anterior e chegue cedo — a fila do hub come 1–3 h.</li>
        <li><b>2ª (tarde)</b>: ML tarde 12–18h ou Shopee Entrega Rápida. Precisa ter voltado da 1ª antes das 12h.</li>
        <li><b>3ª (noite)</b>: ML noite 18–23h ou fretes 99/Lalamove. Devolva insucessos no caminho; devolução ML até 22h.</li>
        <li>Rotas de 60 paradas levam ~6 h porta a porta; três delas não cabem. Três saídas = rotas menores (25–40 paradas) ou a 3ª como frete avulso.</li>
      </ul>
      <p class="small muted">O guia completo, com todas as fontes, está no documento <i>Guia operacional — entregas com Fiorino</i> do projeto.</p>
    </div>
